<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>카페24 연결</title>
<style>
  body { font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; background: #f6f7f9; color: #1d2330;
         display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
  .box { background: #fff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 28px 24px; max-width: 420px; width: 100%; }
  h1 { font-size: 18px; margin: 0 0 10px; }
  p { font-size: 14px; line-height: 1.6; margin: 6px 0; color: #4a5263; }
  .bad { color: #b42318; }
</style>
</head>
<body>
<div class="box">
  <h1 id="t">카페24 연결 중…</h1>
  <p id="m">이 컴퓨터의 수집 프로그램에 연결 정보를 넘기고 있습니다.</p>
</div>
<script>
/* 카페24 공식 API 연결의 돌아오는 자리 (2026-09-21).
 *
 * 카페24 는 인가코드를 https 주소로만 돌려준다. 그래서 여기(GitHub Pages)로 받고,
 * **곧바로 이 컴퓨터의 수집 프로그램(127.0.0.1)** 으로 넘긴다.
 * 코드를 열쇠로 바꾸는 일(비밀키가 필요한 일)은 그 프로그램만 한다. 이 화면은 비밀을 모른다.
 *
 * ⚠ 코드를 어디에도 저장하거나 보내지 않는다 (이 컴퓨터로 넘기는 것 말고는).
 *   코드는 1분이면 죽고, 비밀키 없이는 쓸모가 없다.
 */
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get('code'), state = q.get('state'), err = q.get('error');
  var t = document.getElementById('t'), m = document.getElementById('m');
  if (err) {
    t.textContent = '연결하지 않았습니다';
    m.className = 'bad';
    m.textContent = '카페24 가 거절했습니다: ' + (q.get('error_description') || err);
    return;
  }
  if (!code || !state) {
    t.textContent = '연결 정보가 없습니다';
    m.textContent = '카페24 연결 단추를 눌러서 이 화면에 와야 합니다.';
    return;
  }
  // 주소창·방문기록에 코드가 남지 않게 지운다 (화면 안에서만 들고 있는다)
  try { history.replaceState(null, '', location.pathname); } catch (e) { /* 넘어간다 */ }

  /* 이 컴퓨터의 수집 프로그램에 넘긴다.
   * ⚠ 예전에는 location.replace 로 **이동**했다. 그러면 실패했을 때 이 화면이 사라져
   *   코드를 다시 쓸 길이 없었다. 컴퓨터를 두 대 쓰면(대표 PC·맥북) 반드시 겪는다.
   *   → 이동하지 않고 조용히 보내고, 실패하면 **이 화면에서 손으로 넘기는 길**을 연다. */
  fetch('http://127.0.0.1:47824/cb?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state),
        { mode: 'no-cors', cache: 'no-store' })
    .then(function () {
      t.textContent = '카페24에 동의했습니다';
      m.textContent = '연결 프로그램으로 넘겼습니다. 그 화면에 「연결했습니다」가 뜨면 끝입니다. 이 창은 닫으셔도 됩니다.';
    })
    .catch(function () { manual(); });
  setTimeout(function () { if (t.textContent === '카페24 연결 중…') manual(); }, 6000);

  /* 손으로 넘기는 길 — 다른 컴퓨터에서 동의했을 때 */
  function manual() {
    t.textContent = '이 컴퓨터에서는 바로 넘기지 못합니다';
    m.innerHTML = '다른 컴퓨터(수집 프로그램이 도는 곳)에서 아래 한 줄을 그대로 실행하면 연결됩니다.<br>'
      + '<b>1분 안에</b> 하셔야 합니다 — 이 값은 1분이면 죽습니다.';
    var cmd = 'npm run c24:connect -- --code ' + code;
    var box = document.createElement('div');
    box.style.cssText = 'margin-top:12px;padding:10px;background:#f2f4f7;border-radius:8px;'
      + 'font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;user-select:all';
    box.textContent = cmd;
    var btn = document.createElement('button');
    btn.textContent = '복사';
    btn.style.cssText = 'margin-top:10px;padding:8px 14px;border:0;border-radius:8px;'
      + 'background:#f97316;color:#fff;font-size:13px;cursor:pointer';
    btn.onclick = function () {
      navigator.clipboard.writeText(cmd).then(function () { btn.textContent = '복사했습니다'; });
    };
    document.querySelector('.box').append(box, btn);
  }
})();
</script>
</body>
</html>
